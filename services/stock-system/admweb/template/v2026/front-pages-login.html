<body class="">


   <!-- PAGE CONTAINER -->
   <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->
   <div id="root" class="root front-container"><!-- CONTENTS -->
      <!-- ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ -->

      <div class="min-vh-100 d-flex flex-column align-items-center justify-content-center">

         <!-- Login card -->
         <div class="card shadow-lg">
            <div class="card-body p-4">

               <div class="text-center">
                  <h1 class="h2">Account Login</h1>
                  <p>Sign In to your account</p>
               </div>

               <form class="mt-4" action="index.html">

                  <div class="mb-3">
                     <input type="text" class="form-control" placeholder="Username" autofocus>
                  </div>

                  <div class="mb-3">
                     <input type="password" class="form-control" placeholder="Password">
                  </div>

                  <div class="form-check">
                     <input id="_dm-loginCheck" class="form-check-input" type="checkbox">
                     <label for="_dm-loginCheck" class="form-check-label">
                        Remember me
                     </label>
                  </div>

                  <div class="d-grid mt-5">
                     <button class="btn btn-primary btn-lg" type="submit">Sign In</button>
                  </div>
               </form>

               <div class="d-flex justify-content-between gap-md-5 mt-4">
                  <a href="./front-pages-forgot-password.html" class="link-offset-2 link-underline-dotted">Forgot password ?</a>
                  <a href="./front-pages-register.html" class="link-offset-2 link-underline-dotted">Create a new account</a>
               </div>

               <div class="d-flex align-items-center justify-content-between border-top pt-3 mt-3">
                  <h5 class="m-0">Login with</h5>

                  <!-- Social media buttons -->
                  <div class="ms-3">
                     <a href="#" class="btn btn-sm btn-icon btn-hover btn-primary text-inherit">
                        <i class="psi-facebook fs-5"></i>
                     </a>
                     <a href="#" class="btn btn-sm btn-icon btn-hover btn-dark text-inherit">
                        <i class="psi-twitter-x fs-5"></i>
                     </a>
                     <a href="#" class="btn btn-sm btn-icon btn-hover btn-danger text-inherit">
                        <i class="psi-google-plus fs-5"></i>
                     </a>
                     <a href="#" class="btn btn-sm btn-icon btn-hover btn-warning text-inherit">
                        <i class="psi-instagram fs-5"></i>
                     </a>
                  </div>
                  <!-- END : Social media buttons -->

               </div>


            </div>
         </div>

         <!-- END : Login card -->


         <!-- Show the background images container -->
         <div class="d-flex align-items-center justify-content-center gap-3 mt-4">
            <button class="btn btn-danger hstack gap-2" data-bs-toggle="offcanvas" data-bs-target="#_dm-boxedBgContent">
               <i class=" psi-photo-2 fs-3"></i>
               <span class="vr"></span>
               Background image
            </button>
            <button class="btn btn-light hstack gap-2" onclick="window.history.back()">
               <i class=" psi-left-4 fs-4 opacity-50"></i>
               <span class="vr"></span>
               Back
            </button>
         </div>
         <!-- END : Show the background images container -->

      </div>

      <!-- END - CONTENTS -->
