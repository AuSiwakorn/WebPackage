            <script>
               document.addEventListener("DOMContentLoaded", function() {
                  const defaultClassName = "flex-shrink-1 d-none d-lg-block side-background";
                  const formArea = document.getElementById("_dm-formArea");
                  const backgroundArea = document.getElementById("_dm-bgArea");
                  const switchPosition = document.getElementById("_dm-switchPosition");
                  const options = document.querySelectorAll(`input[name="backgroundAreaOptions"]`);

                  options.forEach(option => {
                     option.addEventListener("change", function() {
                        if (this.checked) {
                           backgroundArea.className = `${defaultClassName} ${this.dataset.classname}`;
                        }
                     });
                  });

                  switchPosition.addEventListener("change", function() {
                     if (this.checked) {
                        backgroundArea.parentNode.insertBefore(backgroundArea, formArea);
                     } else {
                        backgroundArea.parentNode.appendChild(backgroundArea);
                     }
                  });

                  const boxedImgThumbs = [...document.querySelectorAll("._dm-boxbg__thumb")];

                  boxedImgThumbs.map((boxedImgThumb) => {
                     boxedImgThumb.addEventListener("click", (e) => {
                        e.preventDefault();
                        if (boxedImgThumb.classList.contains(".active")) return;

                        let oldImg = document.querySelector("._dm-boxbg__thumb.active ")
                        if (oldImg) oldImg.classList.remove("active");
                        boxedImgThumb.classList.add("active");

                        let targetIMG = boxedImgThumb.querySelector("img").getAttribute("src").replace("thumbs", "bg").replace("./", "/");
                        backgroundArea.style.backgroundImage = `url( .${targetIMG} )`;
                     });
                  });
               });
            </script>
