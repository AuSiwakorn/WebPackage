<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TinyMCE CDN Example</title>
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
  <h3>TinyMCE Example (CDN)</h3>

  <form method="post">
    <textarea id="editor"></textarea>
  </form>

  <script>
    tinymce.init({
      selector: '#editor',          // เลือก textarea ที่จะแปลงเป็น TinyMCE
      height: 300,
      plugins: 'lists link image table code fullscreen',
      toolbar: 'undo redo | styles | bold italic underline | alignleft aligncenter alignright | bullist numlist | link image | table | code fullscreen',
      menubar: false,
      branding: false,
    });
  </script>
</body>
</html>
